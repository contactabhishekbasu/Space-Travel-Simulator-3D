<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SOLARA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SOLARA — a cinematic real-time 3D simulation of the solar system.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23050608'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23ffcf7a'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5' fill='none' stroke='%236fa8ff' stroke-opacity='.75' stroke-width='1.2'/%3E%3Ccircle cx='29' cy='16' r='1.8' fill='%236fa8ff'/%3E%3C/svg%3E">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  #boot-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: radial-gradient(circle at 50% 45%, #10131c 0%, #04050a 55%, #000 100%);
    color: #cfd8ea;
    font: 400 11px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    opacity: 1;
    transition: opacity 420ms ease;
  }

  #boot-loader.is-hidden { opacity: 0; }

  #boot-loader .boot-ring {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(150, 180, 230, 0.18);
    border-top-color: rgba(190, 215, 255, 0.9);
    animation: boot-spin 1.15s linear infinite;
  }

  #boot-loader .boot-text { text-indent: 0.42em; }

  /* Determinate progress, driven by the texture LoadingManager in main.js. */
  #boot-loader .boot-bar {
    width: 150px;
    height: 2px;
    margin-top: -6px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.10);
    overflow: hidden;
  }

  #boot-loader .boot-bar > i {
    display: block;
    height: 100%;
    background: #bed7ff;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 350ms ease;
  }

  /* The world fades up once assets have decoded, rather than cutting in. */
  #app {
    opacity: 0;
    transition: opacity 900ms var(--ease, cubic-bezier(0.22, 0.61, 0.36, 1));
  }

  #app.is-ready { opacity: 1; }

  @keyframes boot-spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    #boot-loader .boot-ring { animation-duration: 3s; }
    #boot-loader .boot-bar > i { transition-duration: 0ms; }
    #app { transition-duration: 0ms; }
  }
</style>

<link rel="stylesheet" href="css/app.css">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>

  <div id="boot-loader" role="status" aria-live="polite">
    <div class="boot-ring" aria-hidden="true"></div>
    <div class="boot-text">Solara</div>
    <div class="boot-bar" aria-hidden="true"><i></i></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
